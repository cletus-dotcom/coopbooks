<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CoopBooks — Philippine Cooperative Accounting{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="{{ url_for('static', filename='images/coop_logo.svg') }}">
    <style>
        :root {
            --coop-green: {{ coop_green }};
            --coop-green-dark: {{ coop_green_dark }};
            --coop-green-light: {{ coop_green_light }};
            --coop-gold: {{ coop_gold }};
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        .btn-coop {
            background-color: var(--coop-green);
            border-color: var(--coop-green);
            color: #fff;
        }
        .btn-coop:hover {
            background-color: var(--coop-green-dark);
            border-color: var(--coop-green-dark);
            color: #fff;
        }
        .text-coop { color: var(--coop-green); }
        .bg-coop { background-color: var(--coop-green) !important; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
